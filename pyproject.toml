[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "django>=6.1.3",
    "djangorestframework>=3.18.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
pythonpath = "src"
