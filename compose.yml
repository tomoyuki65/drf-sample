services:
  drf:
    container_name: drf-api
    build:
      context: .
      dockerfile: ./deploy/docker/local/py/Dockerfile
    command: uv run python src/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    tty: true
    stdin_open: true
    depends_on:
      pg:
        condition: service_healthy
  pg:
    container_name: drf-pg
    build:
      context: .
      dockerfile: ./deploy/docker/local/db/pg/Dockerfile
    environment:
      POSTGRES_DB: "local-db-pg"
      POSTGRES_USER: "root"
      POSTGRES_PASSWORD: "root-pass"
      # ローカル環境でもパスワードを有効化する設定
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
    volumes:
      - drf-api-pg-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_PG_USER} -d ${DB_PG_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  drf-api-pg-data:
